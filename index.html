<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KITSERUKI | D-VSN</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html { 
            margin: 0; padding: 0; background: #010101; color: #ffffff; 
            font-family: 'Inter', sans-serif; overflow: hidden; cursor: none; 
            user-select: none; width: 100vw; height: 100vh;
        }

        .noise {
            position: fixed; inset: 0; z-index: 9998; pointer-events: none;
            opacity: 0.04; mix-blend-mode: overlay;
            background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
        }
        
        #custom-cursor {
            position: fixed; top: 0; left: 0; width: 96px; height: 96px;
            pointer-events: none; z-index: 9999; will-change: transform;
        }
        
        #canvas { position: fixed; inset: 0; z-index: 0; }
        
        /* Base UI System */
        .ui { 
            position: absolute; inset: 0; display: grid; grid-template-columns: 320px 1fr 320px; 
            padding: 4rem; pointer-events: none; z-index: 1; perspective: 1200px; 
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1);
        }
        
        /* UI Transition States */
        .ui.transition-warp { transform: scale(1.8) translateZ(300px); opacity: 0; filter: blur(10px); }
        .ui.transition-drop { transform: translateY(120vh) rotateX(-60deg) scale(0.8); opacity: 0; }
        .ui.transition-lift { transform: translateY(-120vh) rotateX(30deg) scale(0.8); opacity: 0; }

        .panel { 
            pointer-events: auto; background: rgba(5, 5, 5, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.03); padding: 3rem; 
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            display: flex; flex-direction: column; transform-style: preserve-3d; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.02);
            will-change: transform;
        }
        
        h1 { 
            font-size: 1.1rem; letter-spacing: 0.3rem; font-weight: 600; margin: 0; 
            text-transform: uppercase; text-shadow: 0 0 20px rgba(255,255,255,0.3);
            white-space: nowrap;
        }

        .nav-container { margin-top: 4rem; display: flex; flex-direction: column; gap: 1rem; }
        
        .nav-item { 
            padding: 1.2rem; border: 1px solid rgba(255,255,255,0.05);
            cursor: none; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            transform-style: preserve-3d; font-size: 0.85rem; letter-spacing: 0.15rem;
            color: rgba(255,255,255,0.6); position: relative; overflow: hidden;
            background: rgba(255,255,255,0.01);
            text-transform: uppercase;
        }

        .nav-item::after { content: ''; position: absolute; left: 0; bottom: 0; height: 1px; width: 0%; background: #fff; transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .nav-item:hover { transform: translateZ(30px); border-color: rgba(255,255,255,0.2); color: #ffffff; background: rgba(255,255,255,0.03); text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .nav-item:hover::after { width: 100%; }

        .status { font-size: 0.75rem; letter-spacing: 0.2rem; font-weight: 300; display: flex; align-items: center; gap: 0.5rem; color: rgba(255,255,255,0.5); }
        .status::before { content: ''; width: 6px; height: 6px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 10px #00ff88; animation: pulse 2s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Dynamic Content Presentation Layers */
        #content-layer {
            position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
            align-items: center; justify-content: center; pointer-events: none; opacity: 0;
            transition: opacity 1s ease;
        }
        #content-layer.visible { opacity: 1; pointer-events: auto; }

        .content-title {
            font-size: 2rem; letter-spacing: 0.4rem; font-weight: 300; margin-bottom: 2rem;
            text-shadow: 0 0 30px rgba(255,255,255,0.8); text-align: center;
        }

        .return-btn {
            padding: 1rem 3rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.3);
            color: white; font-family: 'Inter', sans-serif; letter-spacing: 0.2rem; cursor: none;
            transition: all 0.3s ease; text-transform: uppercase; font-size: 0.8rem;
            backdrop-filter: blur(10px); margin-top: 2rem;
        }
        .return-btn:hover { background: white; color: black; box-shadow: 0 0 30px rgba(255,255,255,0.8); }

        /* Init Sequence System */
        .init-layout {
            display: flex; gap: 3rem; width: 80vw; max-width: 900px;
            background: rgba(0, 10, 20, 0.5); border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 3rem; backdrop-filter: blur(12px); pointer-events: auto;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 20px 50px rgba(0,0,0,0.5);
        }
        .profile-pic {
            width: 220px; height: 220px; flex-shrink: 0;
            border: 1px dashed rgba(0, 255, 255, 0.4);
            background-color: rgba(0,0,0,0.5);
            background-image: repeating-linear-gradient(45deg, rgba(0,255,255,0.02), rgba(0,255,255,0.02) 10px, transparent 10px, transparent 20px);
            display: flex; align-items: center; justify-content: center;
            color: rgba(0,255,255,0.3); font-size: 0.7rem; letter-spacing: 0.2rem;
            background-size: cover; background-position: center; position: relative;
        }
        .profile-pic::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); pointer-events: none; }
        .bio-text {
            flex: 1; color: rgba(255,255,255,0.8); font-size: 0.9rem; line-height: 1.8;
            overflow-y: auto; max-height: 400px; padding-right: 1rem;
        }
        .bio-text::-webkit-scrollbar { width: 4px; }
        .bio-text::-webkit-scrollbar-thumb { background: rgba(0,255,255,0.3); }

        /* Archive Deck System */
        .archive-deck { display: flex; gap: 1rem; width: 85vw; height: 60vh; max-width: 1400px; perspective: 1200px; }
        .archive-card {
            flex: 1; background: rgba(0, 5, 10, 0.4); border: 1px solid rgba(0, 255, 255, 0.15);
            transition: all 0.7s cubic-bezier(0.19, 1, 0.22, 1);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            position: relative; overflow: hidden; cursor: none;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: inset 0 0 0 1px rgba(0,255,255,0.05);
        }
        .archive-card::before {
            content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,255,255,0.05) 0%, transparent 100%);
            opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
        }
        .archive-card:hover, .archive-card:active, .archive-card.is-open {
            flex: 3; background: rgba(0, 15, 25, 0.6); border-color: rgba(0, 255, 255, 0.6);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,255,255,0.1);
        }
        .archive-card:hover::before, .archive-card.is-open::before { opacity: 1; }
        .card-title { font-size: 1.2rem; letter-spacing: 0.3rem; font-weight: 300; color: rgba(0, 255, 255, 0.5); transition: all 0.5s ease; white-space: nowrap; transform: rotate(-90deg); position: absolute; }
        .archive-card:hover .card-title, .archive-card.is-open .card-title { transform: rotate(0deg) translateY(-40%); color: #00ffff; text-shadow: 0 0 15px rgba(0,255,255,0.5); top: 3rem; position: absolute; }
        .card-content { opacity: 0; transform: translateY(20px); transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1); width: 80%; height: 60%; margin-top: 4rem; display: flex; flex-direction: column; border-top: 1px solid rgba(0,255,255,0.2); padding-top: 2rem; color: rgba(255,255,255,0.8); font-size: 0.9rem; letter-spacing: 0.1rem; line-height: 1.6; pointer-events: none; }
        .archive-card:hover .card-content, .archive-card.is-open .card-content { opacity: 1; transform: translateY(0); transition-delay: 0.2s; }
        
        /* Project Display Classes */
        .proj-text-container {
            width: 100%;
            max-width: 550px;
            flex-shrink: 0;
            font-size: 0.65rem;
            line-height: 1.5;
            margin-bottom: 1rem;
        }
        .proj-img-container {
            flex: 1;
            width: 100%;
            min-height: 160px;
            border: 1px solid rgba(0,255,255,0.3);
            background-size: cover;
            background-position: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            border-radius: 2px;
        }

        /* Specialized Archive Sub-Styles */
        .redacted-block { background: #00ffff; color: #00ffff; display: inline-block; line-height: 1; padding: 0 0.2rem; margin: 0 0.1rem; transition: all 0.3s; }
        .redacted-card:hover .redacted-block, .redacted-card.is-open .redacted-block { background: #fff; color: #fff; }
        .img-redacted { background: #000; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; border-color: rgba(0,255,255,0.4); box-shadow: none; }
        .img-redacted::after { content: 'REDACTED'; color: #00ffff; border: 2px solid #00ffff; padding: 0.5rem 2rem; transform: rotate(-10deg); font-weight: 600; letter-spacing: 0.4rem; background: rgba(0,0,0,0.8); z-index: 2; box-shadow: 0 0 20px rgba(0,255,255,0.2); }
        .img-redacted::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(0,255,255,0.05), rgba(0,255,255,0.05) 2px, transparent 2px, transparent 8px); z-index: 1; }
        
        .corrupt-card { border-color: rgba(255, 0, 85, 0.15); box-shadow: inset 0 0 0 1px rgba(255,0,85,0.05); }
        .corrupt-card::before { background: linear-gradient(180deg, rgba(255,0,85,0.05) 0%, transparent 100%); }
        .corrupt-card:hover, .corrupt-card:active, .corrupt-card.is-open { border-color: rgba(255, 0, 85, 0.6); box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,0,85,0.1); }
        .corrupt-card .card-title { color: rgba(255, 0, 85, 0.5); }
        .corrupt-card:hover .card-title, .corrupt-card.is-open .card-title { color: #ff0055; text-shadow: 0 0 15px rgba(255,0,85,0.5); }
        .corrupt-card .card-content { border-top-color: rgba(255,0,85,0.2); }
        .corrupt-text { font-family: monospace; color: #ff0055; text-shadow: 2px 0 rgba(0,255,255,0.5), -2px 0 rgba(0,255,0,0.5); animation: glitch-anim-heading 2s infinite step-end alternate-reverse; font-weight: 600; font-size: 0.75rem; }
        .img-corrupt { background: #0a0002; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; border: 1px dashed rgba(255,0,85,0.5); box-shadow: inset 0 0 15px rgba(255,0,85,0.2); }
        .img-corrupt::after { content: 'ERR_0x000F'; color: #ff0055; font-family: monospace; font-size: 1.5rem; animation: glitch-anim 0.3s infinite; position: absolute; z-index: 2; }
        .img-corrupt::before { content: ''; position: absolute; inset: 0; background: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="5" numOctaves="1" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)" opacity="0.3"/%3E%3C/svg%3E'); mix-blend-mode: color-dodge; opacity: 0.5; z-index: 1; }

        /* Compliance Matrix System */
        .compliance-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; width: 60vw; max-width: 800px; perspective: 1200px; }
        .compliance-row { 
            display: flex; flex-direction: column; align-items: stretch; 
            padding: 1.5rem 2rem; background: rgba(0, 255, 136, 0.05); 
            border-left: 4px solid #00ff88; border-right: 1px solid rgba(0, 255, 136, 0.1); 
            border-top: 1px solid rgba(0, 255, 136, 0.1); border-bottom: 1px solid rgba(0, 255, 136, 0.1); 
            backdrop-filter: blur(10px); cursor: none; 
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1), background 0.3s, border 0.3s; 
            position: relative; overflow: hidden; transform-origin: center; transform-style: preserve-3d;
        }
        .compliance-row.flipping { transform: rotateX(90deg) scale(0.95); opacity: 0.5; pointer-events: none; }
        .compliance-row::before { content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, rgba(0,255,136,0.2), transparent); transition: left 0.5s ease; pointer-events: none; }
        .compliance-row:not(.flipping):hover { background: rgba(0, 255, 136, 0.15); transform: translateX(20px); box-shadow: 0 10px 30px rgba(0, 255, 136, 0.15); border-right-color: rgba(0, 255, 136, 0.5); }
        .compliance-row:not(.flipping):hover::before { left: 200%; }
        .compliance-row.expanded { background: rgba(0, 255, 136, 0.1); border-right-color: rgba(0, 255, 136, 0.5); transform: translateX(20px); }
        
        .compliance-row-header { display: flex; justify-content: space-between; align-items: center; width: 100%; pointer-events: none; }
        .compliance-row-title { font-weight: 600; letter-spacing: 0.2rem; color: #00ff88; }
        .compliance-row-status { font-size: 0.8rem; letter-spacing: 0.1rem; color: rgba(255,255,255,0.5); font-family: monospace; }
        
        .doc-list {
            display: none; flex-direction: column; gap: 0.8rem; width: 100%; 
            margin-top: 1.5rem; border-top: 1px dashed rgba(0, 255, 136, 0.3); padding-top: 1.5rem;
        }
        .compliance-row.expanded .doc-list { display: flex; animation: fade-in 0.4s ease forwards; }
        
        .doc-link {
            color: rgba(255,255,255,0.6); font-size: 0.85rem; cursor: none; 
            padding: 0.8rem 1rem; transition: all 0.3s; text-transform: uppercase;
            background: rgba(0,0,0,0.3); border: 1px solid rgba(0,255,136,0.1);
            position: relative; overflow: hidden; letter-spacing: 0.15rem;
        }
        .doc-link:hover { color: #000; background: #00ff88; padding-left: 1.5rem; font-weight: 600; box-shadow: 0 0 15px rgba(0,255,136,0.4); }

        @keyframes fade-in { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
        
        /* Central Document View Box styling */
        .doc-view-container {
            width: 80vw; max-width: 900px; height: 60vh; 
            background: rgba(5, 10, 15, 0.7); border: 1px solid rgba(0, 255, 170, 0.3); 
            padding: 2.5rem; color: rgba(200,220,255,0.9); font-size: 0.9rem; 
            overflow-y: auto; line-height: 1.8; font-family: 'Inter', monospace; 
            box-shadow: inset 0 0 30px rgba(0,0,0,0.6), 0 20px 50px rgba(0,0,0,0.8); 
            backdrop-filter: blur(12px); cursor: none;
        }

        /* Uplink Comm (Contact Form) System - Updated Lilac/Mint */
        .uplink-container {
            width: 50vw; max-width: 600px;
            background: rgba(15, 5, 20, 0.6); border: 1px solid rgba(152, 255, 152, 0.3);
            box-shadow: 0 0 40px rgba(221, 160, 221, 0.15), inset 0 0 20px rgba(152, 255, 152, 0.1);
            backdrop-filter: blur(16px); padding: 3rem; transform-origin: top center;
            animation: unfold 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            display: flex; flex-direction: column; gap: 1.5rem; pointer-events: auto;
        }
        @keyframes unfold {
            0% { transform: scaleY(0.01) scaleX(0.5); opacity: 0; }
            50% { transform: scaleY(0.01) scaleX(1); opacity: 1; }
            100% { transform: scaleY(1) scaleX(1); opacity: 1; }
        }
        .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .input-group label { color: #dda0dd; font-size: 0.75rem; letter-spacing: 0.2rem; font-weight: 600; }
        .input-group input, .input-group textarea {
            background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(221, 160, 221, 0.3);
            color: #fff; font-family: 'Inter', monospace; padding: 1rem;
            max-width: 100%;
            outline: none; cursor: none; transition: all 0.3s; resize: none;
        }
        .input-group input:focus, .input-group textarea:focus { 
            border-color: #98ff98; box-shadow: 0 0 15px rgba(152,255,152,0.3); background: rgba(152,255,152,0.05); 
        }
        .submit-btn {
            background: rgba(221, 160, 221, 0.1); border: 1px solid #dda0dd; color: #dda0dd; 
            padding: 1.2rem; font-family: 'Inter', sans-serif; letter-spacing: 0.2rem; 
            cursor: none; text-transform: uppercase; transition: all 0.3s; margin-top: 1rem; font-weight: 600;
        }
        .submit-btn:hover:not(:disabled) { background: #98ff98; color: #000; box-shadow: 0 0 20px #98ff98; border-color: #98ff98; }
        .submit-btn:disabled { opacity: 0.5; border-color: rgba(221, 160, 221, 0.3); color: rgba(221, 160, 221, 0.5); background: transparent; }

        /* Shared Basic Glitch Anim (Rapid) */
        @keyframes glitch-anim {
            0% { clip-path: inset(10% 0 80% 0); transform: translate(-2px, 2px); }
            20% { clip-path: inset(40% 0 10% 0); transform: translate(2px, -2px); }
            40% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, 2px); }
            60% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -2px); }
            80% { clip-path: inset(30% 0 20% 0); transform: translate(-2px, 2px); }
            100% { clip-path: inset(50% 0 30% 0); transform: translate(2px, -2px); }
        }

        /* Heading Slower Stutter Glitch Anim */
        @keyframes glitch-anim-heading {
            0% { clip-path: inset(10% 0 80% 0); transform: translate(-2px, 2px); }
            5% { clip-path: inset(40% 0 10% 0); transform: translate(2px, -2px); }
            10% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, 2px); }
            15% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -2px); }
            20% { clip-path: inset(30% 0 20% 0); transform: translate(-2px, 2px); }
            25% { clip-path: inset(50% 0 30% 0); transform: translate(2px, -2px); }
            30%, 100% { clip-path: inset(100% 0 0% 0); transform: translate(0, 0); }
        }

        .glitch-text { position: relative; color: #98ff98; text-shadow: 0 0 20px rgba(152, 255, 152, 0.6); font-weight: 600; }
        .glitch-text::before, .glitch-text::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; pointer-events: none; }
        .glitch-text::before { left: 3px; text-shadow: -2px 0 #dda0dd; animation: glitch-anim-heading 3s infinite step-end alternate-reverse; }
        .glitch-text::after { left: -3px; text-shadow: -2px 0 #ffffff; animation: glitch-anim-heading 4s infinite step-end alternate-reverse; }

        /* Uplink Canvas Glitch Layers */
        @keyframes glitch-canvas-anim {
            0% { clip-path: inset(10% 0 80% 0); transform: translate(-40%, -50%) translate(-8px, 5px); }
            5% { clip-path: inset(40% 0 10% 0); transform: translate(-40%, -50%) translate(8px, -5px); }
            10% { clip-path: inset(80% 0 5% 0); transform: translate(-40%, -50%) translate(-8px, 5px); }
            15% { clip-path: inset(10% 0 60% 0); transform: translate(-40%, -50%) translate(8px, -5px); }
            20% { clip-path: inset(30% 0 20% 0); transform: translate(-40%, -50%) translate(-8px, 5px); }
            25% { clip-path: inset(50% 0 30% 0); transform: translate(-40%, -50%) translate(8px, -5px); }
            30%, 100% { clip-path: inset(0% 0 0% 0); transform: translate(-50%, -50%); } 
        }
        @keyframes glitch-canvas-anim-large {
            0% { clip-path: inset(10% 0 80% 0); transform: translate(20%, 30%) translate(-15px, 15px); }
            5% { clip-path: inset(40% 0 10% 0); transform: translate(20%, 30%) translate(15px, -15px); }
            10% { clip-path: inset(80% 0 5% 0); transform: translate(20%, 30%) translate(-15px, 15px); }
            15% { clip-path: inset(10% 0 60% 0); transform: translate(20%, 30%) translate(15px, -15px); }
            20% { clip-path: inset(30% 0 20% 0); transform: translate(20%, 30%) translate(-15px, 15px); }
            25% { clip-path: inset(50% 0 30% 0); transform: translate(20%, 30%) translate(15px, -15px); }
            30%, 100% { clip-path: inset(0% 0 0% 0); transform: translate(20%, 30%); }
        }
        .glitch-canvas-primary {
            position: absolute; top: 50%; left: 0%; z-index: -1; pointer-events: none; mix-blend-mode: screen;
            animation: glitch-canvas-anim 3.5s infinite step-end alternate-reverse;
        }
        .glitch-canvas-secondary {
            position: absolute; top: 80%; left: 40%; z-index: -1; pointer-events: none; mix-blend-mode: screen;
            animation: glitch-canvas-anim-large 4.2s infinite step-end alternate-reverse;
        }

        /* Button specific glitch states */
        .btn-glitch { position: relative; overflow: hidden; }
        .btn-glitch::before, .btn-glitch::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(221, 160, 221, 0.1); color: #98ff98; pointer-events: none; }
        .btn-glitch::before { left: 2px; text-shadow: -1px 0 #dda0dd; animation: glitch-anim 0.2s infinite linear alternate-reverse; }
        .btn-glitch::after { left: -2px; text-shadow: -1px 0 #ffffff; animation: glitch-anim 0.3s infinite linear alternate-reverse; }
        .btn-glitch-intense::before { animation-duration: 0.05s; transform: scale(1.02); }
        .btn-glitch-intense::after { animation-duration: 0.07s; transform: scale(1.02); }

        /* Mobile Responsiveness */
        @media (max-width: 800px) {
            .ui { display: flex; flex-direction: column; justify-content: space-between; padding: 1.5rem; }
            .ui > div:not(.panel) { display: none; }
            .panel { width: 100%; padding: 1.5rem; }
            .nav-container { margin-top: 1.5rem; }
            .content-title { font-size: 1.2rem; }
            
            /* Init Sequence Mobile Scaling */
            .init-layout { flex-direction: column; align-items: center; padding: 1.5rem; width: 90vw; }
            .profile-pic { width: 160px; height: 160px; }
            .bio-text { max-height: 40vh; font-size: 0.8rem; padding-right: 0; }

            /* Strict Mobile Archive Deck Scaling */

<script>
    // 0. Procedural Audio Engine
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    const unlockAudio = () => {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    };
    document.body.addEventListener('click', unlockAudio, { once: true });
    document.body.addEventListener('touchstart', unlockAudio, { once: true, passive: true });

    function playHoverClick() {
        if (audioCtx.state === 'suspended') return;
        
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime); 

        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
    }

    // Hash Update Router
    function updateHash(hashPath) {
        if (history.replaceState) {

        }

    // 1. Scene Setup

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 2. Symbiote / Organic Geometry Setup
    const symbioteGeom = new THREE.IcosahedronGeometry(120, 64);

    const symbioteVertexShader = `
        uniform float uTime;
        uniform vec2 uMouse;
        uniform float uInteraction;
        
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying float vNoise;
        varying float vMouseForce;
        varying vec3 vWorldPos;

        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        float snoise(vec3 v) {
            const vec2 C = vec2(1.0/6.0, 1.0/3.0);
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i  = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min( g.xyz, l.zxy );
            vec3 i2 = max( g.xyz, l.zxy );
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute( permute( permute( 
                        i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                      + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                      + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
            float n_ = 0.142857142857;
            vec3  ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_ );
            vec4 x = x_ *ns.x + ns.yyyy;
            vec4 y = y_ *ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4( x.xy, y.xy );
            vec4 b1 = vec4( x.zw, y.zw );
            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
            vec3 p0 = vec3(a0.xy,h.x);
            vec3 p1 = vec3(a0.zw,h.y);
            vec3 p2 = vec3(a1.xy,h.z);
            vec3 p3 = vec3(a1.zw,h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            m = m * m;
            return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
        }

        void main() {
            vec3 pos = position;
            
            float n1 = snoise(pos * 0.02 + uTime * 0.3);
            float n2 = snoise(pos * 0.05 - uTime * 0.5);
            float combinedNoise = (n1 * 0.7) + (n2 * 0.3);
            vNoise = combinedNoise;

            vec4 tempMvPos = modelViewMatrix * vec4(pos, 1.0);
            vec4 tempScreenPos = projectionMatrix * tempMvPos;
            vec2 ndc = tempScreenPos.xy / tempScreenPos.w;
            
            float mouseDist = length(ndc - uMouse);
            float mouseForce = smoothstep(0.8, 0.0, mouseDist);
            vMouseForce = mouseForce;
            
            vec3 inwardsNormal = -normal;
            float displacement = (combinedNoise * 18.0) + (mouseForce * 25.0 * uInteraction);
            pos += inwardsNormal * displacement;

            vWorldPos = pos;
            vNormal = normalMatrix * inwardsNormal;
            
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            vViewPosition = -mvPosition.xyz;
            
            gl_Position = projectionMatrix * mvPosition;
        }
    `;

    const symbioteFragmentShader = `
        uniform vec3 uColorA;
        uniform vec3 uColorB;
        uniform float uTime;
        uniform float uInteraction;
        
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying float vNoise;
        varying float vMouseForce;
        varying vec3 vWorldPos;

        void main() {
            vec3 normal = normalize(vNormal);
            vec3 viewDir = normalize(vViewPosition);
            
            normal = normalize(normal + vec3(vNoise * 0.25));

            vec3 lightDir = normalize(vec3(0.5, 1.0, 1.0));
            float diff = max(dot(normal, lightDir), 0.0);
            
            vec3 halfVector = normalize(lightDir + viewDir);
            float spec = pow(max(dot(normal, halfVector), 0.0), 80.0); 
            
            float rim = 1.0 - max(dot(viewDir, normal), 0.0);
            rim = smoothstep(0.5, 1.0, rim);
            
            vec3 baseColor = vec3(0.01, 0.01, 0.012);
            vec3 reactionColor = mix(uColorA, uColorB, vNoise * 0.5 + 0.5);
            
            vec3 glow = reactionColor * (vMouseForce * uInteraction * 1.8 + rim * 0.5 + spec * 2.5);
            
            float crevice = smoothstep(0.2, -0.6, vNoise);
            vec3 subsurface = reactionColor * crevice * 0.8;

            vec3 finalColor = baseColor + glow + subsurface;
            
            float depth = gl_FragCoord.z / gl_FragCoord.w;
            float fogFactor = smoothstep(40.0, 180.0, depth);
            finalColor = mix(finalColor, vec3(0.0), fogFactor);

            gl_FragColor = vec4(finalColor, 1.0);
        }

                'PROJEKT_ARCHIVE': 'archive',

                'UPLINK_COMM': 'uplink'

            }

    function animate() {
        requestAnimationFrame(animate);

        // Cursor Physics & Lerping

        cursorY += (mouseY - cursorY) * lerpFactor;
        cursorCanvas.style.transform = `translate3d(${cursorX - 48}px, ${cursorY - 48}px, 0)`;

        // Update Shader Mouse Coordinates
        const normMouseX = (mouseX / window.innerWidth) * 2 - 1;
        const normMouseY = -(mouseY / window.innerHeight) * 2 + 1;
        sharedUniforms.uMouse.value.set(normMouseX, normMouseY);

        // Dynamic Cursor Rendering
        hoverProgress += ((isHovering ? 1 : 0) - hoverProgress) * 0.15;
        ctx.clearRect(0, 0, 96, 96);
        const center = 48;

        sphereSpin += delta * (2.5 + hoverProgress * 5.0);

        const r = Math.round(255 - (255 * hoverProgress));
        const g = 255; 
        const b = Math.round(255 - (119 * hoverProgress));
        const colorStr = `rgba(${r}, ${g}, ${b}`;

        const orbit = 16 + (8 * hoverProgress);
        const sSize = 2 + (1.5 * hoverProgress);
        
        const points = [];
        for(let i = 0; i < 3; i++) {
            const angle = sphereSpin + (i * (Math.PI * 2 / 3));
            points.push({ x: center + Math.cos(angle) * orbit, y: center + Math.sin(angle) * orbit });
        }

        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        ctx.lineTo(points[1].x, points[1].y);
        ctx.lineTo(points[2].x, points[2].y);
        ctx.closePath();
        ctx.strokeStyle = `${colorStr}, ${0.15 + (0.35 * hoverProgress)})`;
        ctx.lineWidth = 1 + (0.5 * hoverProgress);
        ctx.stroke();

        ctx.fillStyle = `${colorStr}, 1)`;
        ctx.shadowBlur = 12 + (8 * hoverProgress);
        ctx.shadowColor = `rgb(${r}, ${g}, ${b})`;

        for(let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.arc(points[i].x, points[i].y, sSize, 0, Math.PI * 2);
            ctx.fill();
        }

        if (hoverProgress > 0.05) {
            ctx.fillStyle = `${colorStr}, ${hoverProgress})`;
            ctx.beginPath(); 
            ctx.arc(center, center, 1.5 * hoverProgress, 0, Math.PI * 2); 
            ctx.fill();
        }

        // Logo Canvas Background Rendering
        logoCtx.clearRect(0, 0, 128, 128);
        const lCenter = 64;
        const lOrbit = 24; 
        const lSize = 2.5;
        const lSpin = simTime * 1.5; 
        
        const lPoints = [];
        for(let i = 0; i < 3; i++) {
            const angle = lSpin + (i * (Math.PI * 2 / 3));
            lPoints.push({ x: lCenter + Math.cos(angle) * lOrbit, y: lCenter + Math.sin(angle) * lOrbit });
        }

        logoCtx.beginPath();
        logoCtx.moveTo(lPoints[0].x, lPoints[0].y);
        logoCtx.lineTo(lPoints[1].x, lPoints[1].y);
        logoCtx.lineTo(lPoints[2].x, lPoints[2].y);
        logoCtx.closePath();
        logoCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        logoCtx.lineWidth = 1.5;
        logoCtx.stroke();

        logoCtx.fillStyle = 'rgba(255, 255, 255, 1)';
        logoCtx.shadowBlur = 15;
        logoCtx.shadowColor = '#ffffff';

        for(let i = 0; i < 3; i++) {
            logoCtx.beginPath();
            logoCtx.arc(lPoints[i].x, lPoints[i].y, lSize, 0, Math.PI * 2);
            logoCtx.fill();
        }

        // Uplink Background Spheres Rendering
        const uplinkCanvas = document.getElementById('uplink-canvas');
        if (uplinkCanvas && systemState === 'uplink') {
            const uCtx = uplinkCanvas.getContext('2d');
            uCtx.clearRect(0, 0, 256, 256);
            const uc = 128;
            const uOrbit = 50; 
            const uSize = 6;
            const uSpin = simTime * 0.6;
            
            const uPoints = [];
            for(let i=0; i<3; i++) {
                const angle = uSpin + (i * (Math.PI * 2 / 3));
                uPoints.push({ x: uc + Math.cos(angle)*uOrbit, y: uc + Math.sin(angle)*uOrbit });
            }
            
            uCtx.beginPath();
            uCtx.moveTo(uPoints[0].x, uPoints[0].y);
            uCtx.lineTo(uPoints[1].x, uPoints[1].y);
            uCtx.lineTo(uPoints[2].x, uPoints[2].y);
            uCtx.closePath();
            uCtx.strokeStyle = 'rgba(221, 160, 221, 0.4)';
            uCtx.lineWidth = 2;
            uCtx.stroke();
            
            uCtx.fillStyle = '#98ff98';
            uCtx.shadowBlur = 20;
            uCtx.shadowColor = '#98ff98';
            for(let i=0; i<3; i++) {
                uCtx.beginPath();
                uCtx.arc(uPoints[i].x, uPoints[i].y, uSize, 0, Math.PI*2);
                uCtx.fill();
            }
        }

        // Secondary Uplink Spheres Rendering
        const uplinkCanvas2 = document.getElementById('uplink-canvas-2');
        if (uplinkCanvas2 && systemState === 'uplink') {
            const uCtx2 = uplinkCanvas2.getContext('2d');
            uCtx2.clearRect(0, 0, 160, 160);
            const uc2 = 80;
            const uOrbit2 = 30; 
            const uSize2 = 4;
            const uSpin2 = simTime * -0.15;
            
            const uPoints2 = [];
            for(let i=0; i<3; i++) {
                const angle = uSpin2 + (i * (Math.PI * 2 / 3));
                uPoints2.push({ x: uc2 + Math.cos(angle)*uOrbit2, y: uc2 + Math.sin(angle)*uOrbit2 });
            }
            
            uCtx2.beginPath();
            uCtx2.moveTo(uPoints2[0].x, uPoints2[0].y);
            uCtx2.lineTo(uPoints2[1].x, uPoints2[1].y);
            uCtx2.lineTo(uPoints2[2].x, uPoints2[2].y);
            uCtx2.closePath();
            uCtx2.strokeStyle = 'rgba(221, 160, 221, 0.3)';
            uCtx2.lineWidth = 1.5;
            uCtx2.stroke();
            
            uCtx2.fillStyle = '#98ff98';
            uCtx2.shadowBlur = 15;
            uCtx2.shadowColor = '#98ff98';
            for(let i=0; i<3; i++) {
                uCtx2.beginPath();
                uCtx2.arc(uPoints2[i].x, uPoints2[i].y, uSize2, 0, Math.PI*2);
                uCtx2.fill();
            }
        }

        // UI Parallax Physics
        if (systemState === 'MENU') {
            targetRotY = normMouseX * 12; targetRotX = -normMouseY * 12;
            currentRotY += (targetRotY - currentRotY) * 0.05;
            currentRotX += (targetRotX - currentRotX) * 0.05;
            navPanel.style.transform = `rotateY(${currentRotY}deg) rotateX(${currentRotX}deg)`;
        }

        // Camera Dynamics (Z-Axis mapping simulates realm traversal)
        camera.position.z += (targetZ - camera.position.z) * 0.02;
        if (cameraShake > 0.01) {
            camera.position.x = (Math.random() - 0.5) * cameraShake;
            camera.position.y = (Math.random() - 0.5) * cameraShake;
            if (systemState !== 'uplink') cameraShake *= 0.9; 
        } else {
            camera.position.x += (0 - camera.position.x) * 0.1;
            camera.position.y += (0 - camera.position.y) * 0.1;
        }

        // Environment Rotation (Subtle drift + DOC_VIEW dampening)
        const isDocView = systemState === 'DOC_VIEW';
        const envRotTargetX = isDocView ? (normMouseX * 0.05) : (normMouseX * 0.2);
        const envRotTargetY = isDocView ? (-normMouseY * 0.05) : (-normMouseY * 0.2);
        const envRotLerp = isDocView ? 0.01 : 0.02;

        symbioteMesh.rotation.y += (envRotTargetX - symbioteMesh.rotation.y) * envRotLerp + (isDocView ? 0.0005 : 0.001);
        symbioteMesh.rotation.x += (envRotTargetY - symbioteMesh.rotation.x) * envRotLerp;

        // Symbiote Biological Pulse Dynamics
        currentSpeed += (speedMult - currentSpeed) * 0.03;
        simTime += delta * currentSpeed;

        const targetInteraction = isDocView ? 0.05 : 1.0;
        sharedUniforms.uInteraction.value += (targetInteraction - sharedUniforms.uInteraction.value) * 0.05;

        sharedUniforms.uTime.value = simTime;
        sharedUniforms.uColorA.value.lerp(targetColorA, 0.03);
        sharedUniforms.uColorB.value.lerp(targetColorB, 0.03);

        renderer.render(scene, camera);
    }
    animate();
</script>
